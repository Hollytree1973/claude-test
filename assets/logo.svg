<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="HLG Veterinary Physiotherapy emblem">
  <defs>
    <linearGradient id="shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="wolf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c1372b"/>
      <stop offset="1" stop-color="#7d1d16"/>
    </linearGradient>
  </defs>
  <!-- Horseshoe (equine) -->
  <path d="M120 24
           C 70 24 40 62 40 112
           C 40 156 64 190 96 206
           L 108 184
           C 84 172 66 146 66 112
           C 66 76 88 50 120 50
           C 152 50 174 76 174 112
           C 174 146 156 172 132 184
           L 144 206
           C 176 190 200 156 200 112
           C 200 62 170 24 120 24 Z"
        fill="url(#shoe)"/>
  <!-- Horseshoe nail holes -->
  <g fill="#c1372b">
    <circle cx="74" cy="86" r="4.2"/>
    <circle cx="70" cy="118" r="4.2"/>
    <circle cx="80" cy="150" r="4.2"/>
    <circle cx="166" cy="86" r="4.2"/>
    <circle cx="170" cy="118" r="4.2"/>
    <circle cx="160" cy="150" r="4.2"/>
  </g>
  <!-- Wolf head (canine) inside the shoe -->
  <g fill="url(#wolf)">
    <path d="M120 78
             L 100 92 L 92 84 L 92 102
             C 84 110 82 122 88 134
             C 94 148 106 156 120 158
             C 134 156 146 148 152 134
             C 158 122 156 110 148 102
             L 148 84 L 140 92 Z"/>
  </g>
  <!-- Wolf face details -->
  <g fill="#0e0e0e">
    <path d="M108 112 l8 4 -8 4 z"/>
    <path d="M132 112 l-8 4 8 4 z"/>
    <path d="M120 132 l7 6 -7 6 -7 -6 z"/>
  </g>
  <!-- Paw print accent (canine) -->
  <g fill="#0e0e0e" transform="translate(120 200)">
    <ellipse cx="0" cy="6" rx="9" ry="7"/>
    <circle cx="-9" cy="-4" r="3.4"/>
    <circle cx="-3" cy="-8" r="3.4"/>
    <circle cx="3" cy="-8" r="3.4"/>
    <circle cx="9" cy="-4" r="3.4"/>
  </g>
</svg>
