<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gibsons EPC Lookup</title>
<style>
  :root{ --emerald:#0E9F6E; --emerald-d:#0F766E; --ink:#13241f; --muted:#5b6b66; --line:#dfe7e3; --amber:#F59E0B; }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#f3f7f5;line-height:1.5}
  header{background:var(--emerald-d);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:10px}
  header h1{font-size:1.15rem;margin:0;font-weight:600}
  .wrap{max-width:760px;margin:0 auto;padding:18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}
  input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px}
  input:focus{outline:none;border-color:var(--emerald);box-shadow:0 0 0 3px rgba(14,159,110,.15)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row .field{flex:1;min-width:160px;margin-bottom:12px}
  button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:12px 18px;cursor:pointer}
  .primary{background:var(--amber);color:#3a2a00}
  .primary:hover{background:#e08e05}
  .ghost{background:#eef4f1;color:var(--emerald-d)}
  .muted{color:var(--muted);font-size:.88rem}
  .status{padding:12px 14px;border-radius:10px;margin-top:12px;font-size:.95rem}
  .status.err{background:#fdecea;color:#a32419;border:1px solid #f3c2bd}
  .status.warn{background:#fff7e6;color:#8a5b00;border:1px solid #f3d99b}
  .status.ok{background:#e7f6ef;color:#0d6b46;border:1px solid #b9e3cd}
  select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px}
  .epc{display:none}
  .rating{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:10px;color:#fff;font-weight:700;font-size:1.4rem;margin-right:10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:14px 0}
  .grid div span{display:block;color:var(--muted);font-size:.78rem}
  .grid div b{font-size:1rem}
  .links a{display:inline-block;margin-right:14px;color:var(--emerald-d);font-weight:600}
  .config{font-size:.85rem}
  details summary{cursor:pointer;font-weight:600;color:var(--emerald-d)}
  pre{white-space:pre-wrap;background:#f6faf8;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.85rem}
  .rA{background:#0a8a3f}.rB{background:#2faa4a}.rC{background:#9ac02e}.rD{background:#f4d100;color:#3a2a00}.rE{background:#f5a623}.rF{background:#ef7d2b}.rG{background:#e30613}
</style>
</head>
<body>
<header>
  <svg width="26" height="26" viewBox="0 0 32 32" fill="none"><rect x="2" y="2" width="28" height="28" rx="7" fill="#10B981"/><path d="M16 9 10 14h12z" fill="#fff"/><rect x="11" y="16" width="10" height="2.4" rx="1.2" fill="#fff"/><rect x="11" y="20" width="10" height="2.4" rx="1.2" fill="#fff"/></svg>
  <h1>Gibsons EPC Lookup</h1>
</header>

<div class="wrap">
  <div class="card">
    <div class="row">
      <div class="field">
        <label for="nameNo">Property number or name</label>
        <input id="nameNo" placeholder="e.g. 45  or  Rose Cottage" autocomplete="off" />
      </div>
      <div class="field">
        <label for="postcode">Postcode</label>
        <input id="postcode" placeholder="e.g. E11 1NS" autocomplete="off" />
      </div>
    </div>
    <button class="primary" id="go">Find EPC</button>
    <div id="status"></div>

    <div id="chooser" style="display:none;margin-top:14px">
      <label for="matches">Several properties matched — choose one:</label>
      <select id="matches"></select>
    </div>
  </div>

  <div class="card epc" id="epcCard">
    <div style="display:flex;align-items:center">
      <span class="rating" id="curRating">–</span>
      <div>
        <b id="epcAddr" style="font-size:1.05rem"></b>
        <div class="muted" id="epcType"></div>
      </div>
    </div>
    <div class="grid">
      <div><span>Current rating</span><b id="curFull"></b></div>
      <div><span>Potential rating</span><b id="potFull"></b></div>
      <div><span>Total floor area</span><b id="floor"></b></div>
      <div><span>Inspection date</span><b id="inspDate"></b></div>
    </div>
    <div class="links" id="links"></div>
    <details style="margin-top:12px">
      <summary>Copy for report</summary>
      <pre id="copyBlock"></pre>
      <button class="ghost" id="copyBtn">Copy to clipboard</button>
    </details>
  </div>

  <div class="card config">
    <details>
      <summary>Settings (one-time)</summary>
      <p class="muted" style="margin-top:10px">Paste the address of your EPC proxy (the Cloudflare Worker URL). Stored on this device only.</p>
      <label for="proxy">EPC proxy URL</label>
      <input id="proxy" placeholder="https://gibsons-epc.<you>.workers.dev" />
      <button class="ghost" id="saveCfg" style="margin-top:10px">Save</button>
      <span id="cfgMsg" class="muted"></span>
    </details>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const PROXY_KEY = 'gibsons_epc_proxy';
$('proxy').value = localStorage.getItem(PROXY_KEY) || '';
$('saveCfg').onclick = () => {
  localStorage.setItem(PROXY_KEY, $('proxy').value.trim());
  $('cfgMsg').textContent = ' Saved.';
};

function setStatus(msg, kind){ const s=$('status'); if(!msg){s.innerHTML='';return;} s.className='status '+kind; s.textContent=msg; }
function ratingClass(r){ return 'rating r'+(r||'').toUpperCase().slice(0,1); }

// Flexible match: a number must appear as its own token (45 ≠ 145); a name is a substring match.
function matches(input, row){
  const a1 = (row['address1']||'').toLowerCase();
  const full = [row['address1'],row['address2'],row['address3']].filter(Boolean).join(', ').toLowerCase();
  const t = input.trim().toLowerCase();
  if(!t) return true;
  if(/^\d+[a-z]?$/.test(t)){
    return new RegExp('(^|\\D)'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(\\D|$)').test(full);
  }
  return full.includes(t) || a1.includes(t);
}

let lastRows = [];

async function lookup(){
  const proxy = (localStorage.getItem(PROXY_KEY)||'').trim();
  const nameNo = $('nameNo').value.trim();
  const pc = $('postcode').value.trim();
  $('epcCard').style.display='none'; $('chooser').style.display='none';
  if(!pc){ setStatus('Please enter a postcode.', 'warn'); return; }
  if(!proxy){ setStatus('Set your EPC proxy URL in Settings first (one-time).', 'warn'); return; }
  setStatus('Searching the EPC register…', 'ok');
  let data;
  try{
    const r = await fetch(proxy + (proxy.includes('?')?'&':'?') + 'postcode=' + encodeURIComponent(pc));
    if(!r.ok){ setStatus('Lookup failed ('+r.status+'). Check the proxy URL / API key.', 'err'); return; }
    data = await r.json();
  }catch(e){ setStatus('Could not reach the EPC proxy. Check your connection / Settings.', 'err'); return; }

  const rows = (data && (data.rows || data.results || data)) || [];
  if(!Array.isArray(rows) || rows.length===0){ setStatus('No EPC found for this property — verify manually.', 'warn'); return; }

  const found = rows.filter(row => matches(nameNo, row));
  if(found.length===0){ setStatus('No EPC found for this property — verify manually.', 'warn'); return; }
  if(found.length===1){ setStatus('', ''); show(found[0]); return; }

  // multiple → dropdown
  lastRows = found;
  const sel = $('matches'); sel.innerHTML='';
  found.forEach((row,i)=>{
    const o=document.createElement('option'); o.value=i;
    o.textContent=[row['address1'],row['address2'],row['address3']].filter(Boolean).join(', ');
    sel.appendChild(o);
  });
  $('chooser').style.display='block';
  setStatus(found.length+' properties matched — choose the correct one below.', 'ok');
  show(found[0]);
}
$('matches').onchange = e => show(lastRows[e.target.value]);

function show(row){
  const addr=[row['address1'],row['address2'],row['address3']].filter(Boolean).join(', ');
  const pc=row['postcode']||'';
  const cur=row['current-energy-rating']||'', pot=row['potential-energy-rating']||'';
  $('curRating').className=ratingClass(cur); $('curRating').textContent=cur||'–';
  $('epcAddr').textContent=addr+(pc?', '+pc:'');
  $('epcType').textContent=[row['property-type'],row['built-form']].filter(Boolean).join(' · ');
  $('curFull').textContent=(cur||'?')+'  ('+(row['current-energy-efficiency']||'?')+')';
  $('potFull').textContent=(pot||'?')+'  ('+(row['potential-energy-efficiency']||'?')+')';
  $('floor').textContent=row['total-floor-area']?row['total-floor-area']+' m²':'—';
  $('inspDate').textContent=row['inspection-date']||row['lodgement-date']||'—';

  const lmk=row['lmk-key']||'';
  const certUrl = lmk ? 'https://find-energy-certificate.service.gov.uk/energy-certificate/'+encodeURIComponent(lmk) : 'https://find-energy-certificate.service.gov.uk/find-a-certificate/search-by-postcode?postcode='+encodeURIComponent(pc);
  const maps='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr+', '+pc);
  $('links').innerHTML='<a target="_blank" rel="noopener" href="'+certUrl+'">View EPC certificate ↗</a>'+
                       '<a target="_blank" rel="noopener" href="'+maps+'">Google Maps ↗</a>';

  $('copyBlock').textContent =
    'EPC — '+addr+(pc?', '+pc:'')+'\n'+
    'Current rating: '+(cur||'?')+' ('+(row['current-energy-efficiency']||'?')+')\n'+
    'Potential rating: '+(pot||'?')+' ('+(row['potential-energy-efficiency']||'?')+')\n'+
    'Property type: '+[row['property-type'],row['built-form']].filter(Boolean).join(', ')+'\n'+
    'Total floor area: '+(row['total-floor-area']?row['total-floor-area']+' m²':'n/a')+'\n'+
    'Inspection date: '+(row['inspection-date']||row['lodgement-date']||'n/a')+'\n'+
    'Certificate: '+certUrl;

  $('epcCard').style.display='block';
}
$('copyBtn').onclick = async () => {
  try{ await navigator.clipboard.writeText($('copyBlock').textContent); $('copyBtn').textContent='Copied ✓'; setTimeout(()=>$('copyBtn').textContent='Copy to clipboard',1500);}catch(e){}
};
$('go').onclick = lookup;
$('postcode').addEventListener('keydown', e=>{ if(e.key==='Enter') lookup(); });
$('nameNo').addEventListener('keydown', e=>{ if(e.key==='Enter') lookup(); });
</script>
</body>
</html>
